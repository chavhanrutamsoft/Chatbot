services:
  - type: web
    name: qdrant-rag-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 2 --chdir backend app:app
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: QDRANT_HOST
        value: https://your-qdrant-instance.onrender.com
        sync: false
      - key: COLLECTION_NAME
        value: quoteplan_chunks
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /
    plan: free
