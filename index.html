<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuotePlan Assistant</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* Prevent FOUC */
        body { visibility: visible; }
    </style>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">📋</div>
                <div>
                    <h1 class="app-title">QuotePlan Assistant</h1>
                    <p class="app-subtitle">Your AI helpdesk for QuotePlan features & procedures</p>
                </div>
            </div>
            <div class="header-right">v1.0 • Local</div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container">
            <div class="messages" id="messagesContainer">

                <!-- Initial Welcome Message -->
                <div class="message bot-message">
                    <div class="avatar">🤖</div>
                    <div class="message-body">
                        <div class="message-content">
                            <strong>👋 Hello! I'm the QuotePlan AI Assistant.</strong>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <form id="chatForm" onsubmit="sendMessage(event)">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="questionInput" 
                        placeholder="Type your question here..."
                        autocomplete="off"
                    >

                    <button type="submit" id="sendBtn" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z"
                                  fill="currentColor"/>
                        </svg>

                        <span id="spinner"
                              style="display:none; margin-left:8px; vertical-align:middle"></span>
                    </button>

                </div>
            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
